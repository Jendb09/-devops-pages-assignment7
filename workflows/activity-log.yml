name: Update activity log

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read  # A PAT stored in secrets.TOKEN performs the write.

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update README activity section
        uses: TheDanniCraft/activity-log@v1
        with:
          GITHUB_USERNAME: Jendb09
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          EVENT_LIMIT: 10
          COMMIT_MESSAGE: "docs: auto-update activity log"
